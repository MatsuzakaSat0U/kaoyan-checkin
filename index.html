const KEY='ky37v2';
let cur=0, storageKind='', BOX=null;
(function(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t');
       BOX=localStorage; storageKind='local'; return; }catch(e){}
  try{ sessionStorage.setItem('__t','1'); sessionStorage.removeItem('__t');
       BOX=sessionStorage; storageKind='session'; return; }catch(e){}
  storageKind='none';
})();
let store={};
try{ store=JSON.parse((BOX?BOX.getItem(KEY):null)||'{}') }catch(e){ store={} }
function td(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function initCur(){var t=td();var i=DAYS.findIndex(function(x){return x.d>=t});cur=(i<0)?DAYS.length-1:i;}
function save(){
  var str=JSON.stringify(store);
  if(BOX){ try{ BOX.setItem(KEY,str); return true; }catch(e){} }
  return false;
}
function storeBadge(){
  var el=document.getElementById('store');
  if(!el) return;
  if(storageKind==='none'){ el.className='store bad'; el.textContent='⚠️ 无法保存：浏览器禁用了存储，请改用 Safari 直接打开'; return; }
  if(storageKind==='session'){ el.className='store bad'; el.textContent='⚠️ 只在本标签页有效，关掉就丢'; return; }
  var c=0; for(var k in store){ if(store[k] && store[k].filter) c+=store[k].filter(Boolean).length; }
  el.className='store ok'; el.textContent='已保存 · 共 '+c+' 项';
}
function backup(){ window.prompt('复制这段存到备忘录，换设备/重置后用「恢复勾选」贴回来：', JSON.stringify(store)); }
function restore(){
  var t=window.prompt('把备份内容整段粘贴进来：');
  if(!t) return;
  try{ var o=JSON.parse(t); if(typeof o!=='object'||!o) throw 0; store=o; save(); render(); }
  catch(e){ alert('内容格式不对'); }
}
function doneCount(i){var s=store[DAYS[i].d]||[];return s.filter(Boolean).length;}
function render(){
  var it=DAYS[cur];
  var total=it.items.length, dn=doneCount(cur);
  var left=Math.ceil((new Date('2026-12-19T00:00:00')-new Date(it.d+'T00:00:00'))/86400000);
  document.getElementById('dTitle').textContent=it.md+' '+it.wd;
  document.getElementById('dSub').textContent=it.short+' · '+dn+'/'+total+(left>=0?' 完成 · 距初试 '+left+' 天':'');
  var s=store[it.d]||[];
  var h='<div class="card">';
  for(var k=0;k<it.items.length;k++){
    var o=it.items[k];
    h+='<div class="item'+(s[k]?' done':'')+'" onclick="tog('+k+')">'
      +'<div class="box"></div><div class="body">'
      +'<div class="tm"><b>'+o.t+'</b></div>'
      +'<div class="txt">'+o.r+'</div></div></div>';
  }
  document.getElementById('today').innerHTML=h+'</div>';
  var all='',n=0,tot=0;
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i],c=doneCount(i),L=d.items.length;n+=c;tot+=L;
    var st=(c===L)?'全勾':(c?c+'/'+L:'未开始');
    all+='<div class="li'+(i===cur?' now':'')+'" onclick="jump('+i+')"><div class="md">'+d.md+'</div><div class="nm">'+d.short+'</div><div class="st">'+st+'</div></div>';
  }
  document.getElementById('all').innerHTML=all;
  document.getElementById('bar').style.width=(tot?(n/tot*100):0)+'%';
  storeBadge();
}
function tog(k){var d=DAYS[cur].d;var s=store[d]||[];s[k]=!s[k];store[d]=s;save();render();}
function go(n){cur=Math.min(DAYS.length-1,Math.max(0,cur+n));render();window.scrollTo({top:0,behavior:'smooth'});}
function jump(i){cur=i;render();window.scrollTo({top:0,behavior:'smooth'});}
