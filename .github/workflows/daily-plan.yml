name: daily-plan

on:
  schedule:
    # 全部是 UTC，北京时间 = UTC+8
    - cron: "30 23 * * *"   # 07:30 当天计划卡
    - cron: "0 4 * * *"     # 12:00 问上午
    - cron: "0 10 * * *"    # 18:00 问下午
    - cron: "0 14 * * *"    # 22:00 问晚上 + 全天收尾
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装中文字体和 Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow

      - name: 按北京时间选动作
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_OPENID: ${{ secrets.QQ_OPENID }}
        run: |
          H=$(TZ=Asia/Shanghai date +%-H)
          echo "北京时间 ${H} 点"
          if [ "$H" -lt 11 ]; then
            python plan/send.py
          elif [ "$H" -lt 16 ]; then
            python plan/checkin.py morning
          elif [ "$H" -lt 21 ]; then
            python plan/checkin.py afternoon
          else
            python plan/checkin.py evening
          fi
